<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobWall - Find Jobs</title>
    <meta name="description"
        content="Search job listings by title. Find positions that match your interests on JobWall.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green-primary: #2ecc71;
            --green-dark: #27ae60;
            --green-light: #d5f5e3;
            --green-glow: rgba(46, 204, 113, 0.18);
            --text-dark: #1a2332;
            --text-mid: #4a5568;
            --text-muted: #8a9ab0;
            --bg-page: #f0f4f8;
            --bg-card: #ffffff;
            --border-light: #e2e8f0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.09);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 22px;
            --radius-pill: 999px;
        }

        /* ===== THREE-ROW FULL-VIEWPORT LAYOUT ===== */
        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            display: grid;
            grid-template-rows: auto auto 1fr;
            /* nav = auto; hero = auto; results = remaining */
        }

        /* ===== TOP NAV BAR ===== */
        .navbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            padding: 0 32px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        /* JobWall wordmark — matches register.html styling */
        .nav-brand {
            font-size: 26px;
            font-weight: 900;
            color: var(--green-primary);
            letter-spacing: -1px;
            text-shadow: 0 2px 8px rgba(46, 204, 113, 0.15);
            user-select: none;
            line-height: 1;
        }

        .nav-cta {
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--green-primary), var(--green-dark));
            padding: 9px 20px;
            border-radius: var(--radius-pill);
            transition: box-shadow 0.2s, transform 0.15s;
            box-shadow: 0 4px 12px var(--green-glow);
            letter-spacing: 0.1px;
        }

        .nav-cta:hover {
            box-shadow: 0 6px 18px rgba(46, 204, 113, 0.38);
            transform: translateY(-1px);
        }

        .nav-cta:active {
            transform: scale(0.97);
        }

        /* ===== HERO / SEARCH PANEL ===== */
        .hero {
            background: linear-gradient(135deg, #1a2c1e 0%, #1e3a28 50%, #22462e 100%);
            padding: 28px 40px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative blobs */
        .hero::before {
            content: '';
            position: absolute;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(46, 204, 113, 0.22) 0%, transparent 70%);
            top: -140px;
            left: -60px;
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(46, 204, 113, 0.16) 0%, transparent 70%);
            bottom: -100px;
            right: -30px;
            pointer-events: none;
        }

        .hero h1 {
            font-size: clamp(22px, 3vw, 32px);
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
            letter-spacing: -1px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .hero h1 .highlight {
            background: linear-gradient(90deg, var(--green-primary), #a8f0c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== SEARCH BOX ===== */
        .search-wrapper {
            max-width: 680px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(46, 204, 113, 0.15);
            padding: 6px 6px 6px 16px;
            gap: 10px;
            transition: box-shadow 0.3s;
        }

        .search-box:focus-within {
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28), 0 0 0 3px rgba(46, 204, 113, 0.4);
        }

        .search-icon {
            flex-shrink: 0;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .search-box:focus-within .search-icon {
            color: var(--green-primary);
        }

        #job-search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background: transparent;
            padding: 9px 0;
            caret-color: var(--green-primary);
        }

        #job-search-input::placeholder {
            color: var(--text-muted);
        }

        .search-divider {
            width: 1px;
            height: 24px;
            background: var(--border-light);
            flex-shrink: 0;
        }

        #search-btn {
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--green-primary), var(--green-dark));
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            padding: 11px 24px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: box-shadow 0.2s, transform 0.15s;
            box-shadow: 0 4px 12px var(--green-glow);
        }

        #search-btn:hover {
            box-shadow: 0 6px 18px rgba(46, 204, 113, 0.4);
            transform: translateY(-1px);
        }

        #search-btn:active {
            transform: scale(0.97);
        }

        /* ===== SUGGESTION CHIPS ===== */
        .suggestions {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 12px;
            position: relative;
            z-index: 1;
        }

        .suggestions-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
        }

        .chip {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.13);
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .chip:hover {
            background: rgba(46, 204, 113, 0.18);
            border-color: rgba(46, 204, 113, 0.45);
            color: var(--green-primary);
            transform: translateY(-1px);
        }

        /* ===== RESULTS PANEL ===== */
        .results-panel {
            background: var(--bg-page);
            overflow-y: auto;
            padding: 20px 40px;
        }

        /* Results status line */
        .results-status {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
            min-height: 18px;
        }

        .results-status strong {
            color: var(--green-dark);
            font-weight: 600;
        }

        /* ===== SEARCHING STATE ===== */
        .searching-state {
            display: none;
            text-align: center;
            padding: 28px 20px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-light);
            border-top-color: var(--green-primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .searching-text {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px 20px;
        }

        .empty-state-icon {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .empty-state-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .empty-state-body {
            font-size: 13px;
            color: var(--text-muted);
            max-width: 320px;
            line-height: 1.6;
        }

        /* ===== RESULTS GRID ===== */
        .results-grid {
            display: none;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        /* ===== JOB CARD ===== */
        .job-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
            cursor: default;
            animation: fadeIn 0.3s ease forwards;
        }

        .job-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--green-primary);
            transform: translateY(-2px);
        }

        /* Company logo placeholder */
        .job-card-logo {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: var(--green-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--green-dark);
            text-transform: uppercase;
        }

        .job-card-body {
            flex: 1;
            min-width: 0;
        }

        .job-card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .job-card-company {
            font-size: 13px;
            color: var(--text-mid);
            margin-bottom: 8px;
        }

        .job-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            font-size: 11px;
            font-weight: 500;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            border: 1px solid;
        }

        .tag-type {
            color: #2563eb;
            border-color: #bfdbfe;
            background: #eff6ff;
        }

        .tag-workplace {
            color: #7c3aed;
            border-color: #ddd6fe;
            background: #f5f3ff;
        }

        .tag-industry {
            color: var(--text-mid);
            border-color: var(--border-light);
            background: var(--bg-page);
        }

        /* Salary & date on the right */
        .job-card-right {
            flex-shrink: 0;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .job-card-salary {
            font-size: 13px;
            font-weight: 700;
            color: var(--green-dark);
            white-space: nowrap;
        }

        .job-card-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ===== FADE IN ===== */
        .fade-in {
            opacity: 0;
            animation: fadeIn 0.35s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .navbar {
                padding: 0 16px;
            }

            .hero {
                padding: 20px 16px 24px;
            }

            .results-panel {
                padding: 16px;
            }

            #search-btn span {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- ===== NAV BAR ===== -->
    <nav class="navbar">
        <span class="nav-brand">JobWall</span>
        <a href="register.html" class="nav-cta" id="nav-get-started">Get Started &rarr;</a>
    </nav>

    <!-- ===== HERO / SEARCH PANEL ===== -->
    <section class="hero">
        <h1>Find Your <span class="highlight">Dream Job</span> Now</h1>

        <div class="search-wrapper">
            <div class="search-box" id="search-box-container">
                <span class="search-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                </span>

                <input type="search" id="job-search-input" name="q" autocomplete="off" spellcheck="false"
                    placeholder='Job title, e.g. "Software Engineer", "Data Analyst"...' aria-label="Search job titles"
                    maxlength="120" />

                <div class="search-divider" aria-hidden="true"></div>

                <button id="search-btn" type="button" aria-label="Search jobs">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <span>Search</span>
                </button>
            </div>

            <!-- Suggestion chips -->
            <div class="suggestions" role="region" aria-label="Popular job searches">
                <span class="suggestions-label">Popular:</span>
                <button class="chip" data-query="Software Engineer" type="button">Software Engineer</button>
                <button class="chip" data-query="Data Analyst" type="button">Data Analyst</button>
                <button class="chip" data-query="UI/UX Designer" type="button">UI/UX Designer</button>
                <button class="chip" data-query="Project Manager" type="button">Project Manager</button>
                <button class="chip" data-query="Marketing Executive" type="button">Marketing Executive</button>
            </div>
        </div>
    </section>

    <!-- ===== RESULTS PANEL ===== -->
    <div class="results-panel">

        <!-- Status line e.g. "2 jobs found for …" -->
        <div class="results-status" id="results-status" aria-live="polite"></div>

        <!-- Searching spinner -->
        <div class="searching-state" id="searching-state" role="status">
            <div class="spinner" aria-hidden="true"></div>
            <p class="searching-text">Searching for jobs&hellip;</p>
        </div>

        <!-- Results grid (job cards injected dynamically) -->
        <div class="results-grid" id="results-grid" aria-live="polite" aria-label="Job search results"></div>

        <!-- Empty / default state -->
        <div class="empty-state fade-in" id="empty-state">
            <div class="empty-state-icon">&#x1F50D;</div>
            <h2 class="empty-state-title" id="empty-title">Search for your next opportunity</h2>
            <p class="empty-state-body" id="empty-body">
                Type a job title above &mdash; try <strong>&ldquo;Software Engineer&rdquo;</strong> or a chip above
                &mdash; and hit <strong>Search</strong>.
            </p>
        </div>

    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        const searchInput = document.getElementById('job-search-input');
        const searchBtn = document.getElementById('search-btn');
        const chips = document.querySelectorAll('.chip');
        const emptyState = document.getElementById('empty-state');
        const emptyTitle = document.getElementById('empty-title');
        const emptyBody = document.getElementById('empty-body');
        const searchingState = document.getElementById('searching-state');
        const resultsGrid = document.getElementById('results-grid');
        const resultsStatus = document.getElementById('results-status');

        /* ── Chip → fill input + search ── */
        chips.forEach(function (chip) {
            chip.addEventListener('click', function () {
                searchInput.value = chip.dataset.query;
                searchInput.focus();
                triggerSearch();
            });
        });

        /* ── Search button ── */
        searchBtn.addEventListener('click', triggerSearch);

        /* ── Enter key ── */
        searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') triggerSearch();
        });

        /* ── Native clear (×) resets to default ── */
        searchInput.addEventListener('search', function () {
            if (searchInput.value === '') resetToDefault();
        });

        /* ── Main search trigger ── */
        function triggerSearch() {
            var query = searchInput.value.trim();
            if (!query) { searchInput.focus(); return; }

            showState('searching');
            resultsStatus.textContent = '';

            fetch('/api/jobs?q=' + encodeURIComponent(query))
                .then(function (res) {
                    if (!res.ok) throw new Error('Server error: ' + res.status);
                    return res.json();
                })
                .then(function (jobs) {
                    if (jobs.length === 0) {
                        showState('empty-search');
                        resultsStatus.innerHTML =
                            'No jobs found for <strong>&ldquo;' + query + '&rdquo;</strong>';
                        emptyTitle.textContent = 'No results for \u201C' + query + '\u201D';
                        emptyBody.innerHTML =
                            'Try a different job title or use one of the suggestion chips above.';
                    } else {
                        renderResults(jobs, query);
                    }
                })
                .catch(function (err) {
                    showState('empty-search');
                    resultsStatus.textContent = 'Something went wrong. Please try again.';
                    emptyTitle.textContent = 'Error';
                    emptyBody.textContent = err.message;
                });
        }

        /* ── Render job cards ── */
        function renderResults(jobs, query) {
            resultsGrid.innerHTML = '';

            jobs.forEach(function (job) {
                var card = document.createElement('div');
                card.className = 'job-card';

                var initial = job.company.charAt(0);
                var postedLabel = formatDate(job.postedAt);

                card.innerHTML =
                    '<div class="job-card-logo" aria-hidden="true">' + initial + '</div>' +
                    '<div class="job-card-body">' +
                    '<div class="job-card-title">' + escHtml(job.title) + '</div>' +
                    '<div class="job-card-company">' + escHtml(job.company) + ' &middot; ' + escHtml(job.location) + '</div>' +
                    '<div class="job-card-tags">' +
                    '<span class="tag tag-type">' + escHtml(job.jobType) + '</span>' +
                    '<span class="tag tag-workplace">' + escHtml(job.workplaceModel) + '</span>' +
                    '<span class="tag tag-industry">' + escHtml(job.industry) + '</span>' +
                    '</div>' +
                    '</div>' +
                    '<div class="job-card-right">' +
                    '<div class="job-card-salary">' + escHtml(job.salary) + '</div>' +
                    '<div class="job-card-date">Posted ' + postedLabel + '</div>' +
                    '</div>';

                resultsGrid.appendChild(card);
            });

            showState('results');
            var count = jobs.length;
            resultsStatus.innerHTML =
                '<strong>' + count + '</strong> job' + (count === 1 ? '' : 's') +
                ' found for <strong>&ldquo;' + escHtml(query) + '&rdquo;</strong>';
        }

        /* ── Escape HTML (XSS safety) ── */
        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        /* ── Relative date label ── */
        function formatDate(isoDate) {
            var posted = new Date(isoDate);
            var today = new Date();
            var diffDays = Math.floor((today - posted) / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'today';
            if (diffDays === 1) return 'yesterday';
            if (diffDays < 7) return diffDays + ' days ago';
            if (diffDays < 30) {
                var weeks = Math.floor(diffDays / 7);
                return weeks + ' week' + (weeks > 1 ? 's' : '') + ' ago';
            }
            return posted.toLocaleDateString('en-MY', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        /* ── State machine ── */
        function showState(state) {
            emptyState.style.display = 'none';
            searchingState.style.display = 'none';
            resultsGrid.style.display = 'none';

            if (state === 'empty' || state === 'empty-search') {
                emptyState.style.display = 'flex';
            } else if (state === 'searching') {
                searchingState.style.display = 'block';
            } else if (state === 'results') {
                resultsGrid.style.display = 'grid';
            }
        }

        /* ── Reset to default browse state ── */
        function resetToDefault() {
            showState('empty');
            resultsStatus.textContent = '';
            emptyTitle.textContent = 'Search for your next opportunity';
            emptyBody.innerHTML =
                'Type a job title above \u2014 try <strong>\u201CSoftware Engineer\u201D</strong> or a chip above \u2014 and hit <strong>Search</strong>.';
        }
    </script>

</body>

</html>
