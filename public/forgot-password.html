<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        body { font-family: sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { margin-top: 0; color: #111827; }
        input { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem 0; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        .msg { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; display: none; font-size: 0.875rem; }
        .success { background: #def7ec; color: #03543f; }
        .error { background: #fde8e8; color: #9b1c1c; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Forgot Password?</h2>
        <p style="color: #6b7280; font-size: 0.875rem;">Enter your email to receive a recovery link.</p>
        <form id="forgotForm">
            <label>Email Address</label>
            <input type="email" id="email" required placeholder="hello@example.com">
            <button type="submit">Send Reset Link</button>
        </form>
        <div id="msgBox" class="msg"></div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msgBox = document.getElementById('msgBox');

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                msgBox.style.display = 'block';

                if (res.ok) {
                    msgBox.className = 'msg success';
                    msgBox.innerText = "Simulated email sent! Check your VS Code terminal console logs for the clickable link.";
                } else {
                    msgBox.className = 'msg error';
                    msgBox.innerText = data.error || "An error occurred.";
                }
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.className = 'msg error';
                msgBox.innerText = "Failed to connect to server.";
            }
        });
    </script>
</body>
</html>
