<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Job Portal</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { margin-bottom: 0.5rem; color: #111827; }
        p { color: #6b7280; font-size: 0.875rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.875rem; }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
        .message { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; font-size: 0.875rem; display: none; }
        .success { background: #def7ec; color: #03543f; }
        .error { background: #fde8e8; color: #9b1c1c; }
    </style>
</head>
<body>

<div class="container" id="request-box">
    <h2>Forgot Password?</h2>
    <p>Enter your email address and we'll send you a link to reset your password.</p>
    
    <form id="request-form">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <button type="submit">Send Reset Link</button>
    </form>
    <div id="request-msg" class="message"></div>
</div>

<script>
    const requestForm = document.getElementById('request-form');
    const requestMsg = document.getElementById('request-msg');

    requestForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;

        try {
            // Call the backend API route we will create next
            const response = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            requestMsg.style.display = 'block';
            if (response.ok) {
                requestMsg.className = 'message success';
                requestMsg.innerText = "Success! A mock secure reset token link has been generated. Check your console log.";
            } else {
                requestMsg.className = 'message error';
                requestMsg.innerText = data.error || "An error occurred.";
            }
        } catch (err) {
            requestMsg.style.display = 'block';
            requestMsg.className = 'message error';
            requestMsg.innerText = "Cannot connect to server.";
        }
    });
</script>
</body>
</html>
