<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal - Create Company Profile</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #f4f7f6 0%, #eaf7f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .page-card {
            background: #ffffff;
            width: 100%;
            max-width: 900px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: #ffffff;
            padding: 32px 36px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.95;
        }

        .form-body {
            padding: 32px 36px 36px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 7px;
            font-size: 14px;
        }

        /* required-field marker */
        label.required::after {
            content: " *";
            color: #e74c3c;
            margin-left: 4px;
            font-weight: 700;
        }

        input, textarea, select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dfe6e1;
            border-radius: 10px;
            background: #f8fbf9;
            font-size: 14px;
            transition: 0.2s ease;
        }

        /* Select-specific fixes: remove native arrow, add custom caret and spacing */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%232c3e50' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px 14px;
            padding-right: 44px; /* room for the caret */
            min-width: 0; /* prevents grid overflow on narrow screens */
        }

        textarea {
            min-height: 140px;
            resize: vertical;
            padding: 16px 18px;
            line-height: 1.6;
            font-size: 14px;
            color: #233;
            border-radius: 10px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.15);
            background: #ffffff;
        }

        .file-input {
            padding: 10px;
            background: #ffffff;
        }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .primary-btn {
            background: #2ecc71;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(46, 204, 113, 0.22);
        }

        .secondary-btn {
            background: #eef5f0;
            color: #2c3e50;
        }

        @media (max-width: 900px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .header, .form-body {
                padding: 20px;
            }

            .page-card {
                border-radius: 12px;
                box-shadow: 0 10px 24px rgba(0,0,0,0.07);
            }
        }
    </style>
</head>
<body>
    <div class="page-card">
        <div class="header">
            <h1>Create Company Profile</h1>
            <p>Tell employers and job seekers more about your organization.</p>
        </div>

        <div class="form-body">
            <form>
                <div class="form-grid">
                    <div class="full-width">
                        <label for="companyName" class="required">Company Name</label>
                        <input id="companyName" name="companyName" type="text" placeholder="Enter company name" required>
                    </div>

                    <div class="full-width">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" placeholder="Describe your company, mission, and values"></textarea>
                    </div>

                    <div>
                        <label for="industry" class="required">Industry</label>
                        <select id="industry" name="industry" required>
                            <option value="">Select industry</option>
                            <option value="technology">Technology</option>
                            <option value="healthcare">Healthcare</option>
                            <option value="finance">Finance</option>
                            <option value="education">Education</option>
                            <option value="retail">Retail</option>
                            <option value="manufacturing">Manufacturing</option>
                            <option value="marketing">Marketing & Advertising</option>
                            <option value="construction">Construction</option>
                            <option value="transportation">Transportation & Logistics</option>
                            <option value="energy">Energy & Utilities</option>
                            <option value="realestate">Real Estate</option>
                            <option value="hospitality">Hospitality & Tourism</option>
                            <option value="legal">Legal</option>
                            <option value="nonprofit">Non-profit / NGO</option>
                            <option value="telecom">Telecommunications</option>
                            <option value="agriculture">Agriculture</option>
                            <option value="biotech">Biotechnology</option>
                            <option value="automotive">Automotive</option>
                            <option value="media">Media & Entertainment</option>
                            <option value="government">Government</option>
                        </select>
                    </div>

                    <div>
                        <label for="address" class="required">Address</label>
                        <input id="address" name="address" type="text" placeholder="Company address" required>
                    </div>

                    <div>
                        <label for="email" class="required">Email</label>
                        <input id="email" name="email" type="email" placeholder="company@example.com" required>
                    </div>

                    <div>
                        <label for="phone" class="required">Phone Number</label>
                        <input id="phone" name="phone" type="tel" placeholder="e.g. +60 12 345 6789" required>
                    </div>

                    <div>
                        <label for="website">Website</label>
                        <input id="website" name="website" type="url" placeholder="https://yourcompany.com">
                    </div>

                    <div class="full-width actions">
                        <button class="secondary-btn" type="button">Cancel</button>
                        <button class="primary-btn" type="submit">Save Profile</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
