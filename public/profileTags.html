<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Tag Management - JobWall</title>
    <style>
    * {box-sizing: border-box;font-family: 'Arial', 'Segoe UI', sans-serif;margin: 0;padding: 0;}
    body {background-color: #f4f7f6;min-height: 100vh;display: flex;justify-content: center;align-items: center;padding: 2rem 1rem;position: relative;}

    .bg-animation-wrapper {position: fixed;top: 0;left: 0;width: 100%;height: 100%;overflow: hidden;z-index: 1;filter: blur(60px);pointer-events: none;}
    .bg-shape {position: absolute;opacity: 0.4;animation: floatAround 20s infinite linear;}
    .bg-shape.circle-1 {width: 180px;height: 180px;background-color: #2ecc71;border-radius: 50%;top: 15%;left: 10%;animation-duration: 25s;}
    .bg-shape.square-1 {width: 220px;height: 220px;background-color: #27ae60;bottom: 10%;right: 15%;border-radius: 20px;animation-duration: 30s;}
    .bg-shape.triangle-1 {width: 0;height: 0;border-left: 100px solid transparent;border-right: 100px solid transparent;border-bottom: 180px solid #a3e4d7;top: 50%;left: 70%;animation-duration: 22s;}
    .bg-shape.circle-2 {width: 250px;height: 250px;background-color: #bdc3c7;border-radius: 50%;bottom: 40%;left: 25%;animation-duration: 35s;}
    @keyframes floatAround {0% {transform: translate(0,0) rotate(0deg);} 50% {transform: translate(80px,60px) rotate(180deg);} 100% {transform: translate(0,0) rotate(360deg);}}

    .container {background: rgba(255,255,255,0.92);backdrop-filter: blur(8px);border-radius: 20px;box-shadow: 0 20px 60px rgba(0,0,0,0.08);width: 820px;max-width: 100%;padding: 2rem 2.5rem 2.5rem;z-index: 10;position: relative;max-height: 90vh;display: flex;flex-direction: column;}

    .header {display: flex;justify-content: space-between;align-items: center;border-bottom: 2px solid #2ecc71;padding-bottom: 1rem;margin-bottom: 1.5rem;flex-shrink: 0;}
    .header .title {display: flex;align-items: center;gap: 12px;}
    .header .title h1 {font-size: 1.6rem;color: #2c3e50;font-weight: 700;}
    .header .title .count-badge {background: #2ecc71;color: #fff;border-radius: 30px;padding: 0.1rem 1rem;font-size: 0.85rem;font-weight: 600;}
    .header .back-link {color: #7f8c8d;text-decoration: none;font-weight: 600;display: flex;align-items: center;gap: 6px;padding: 6px 16px;border-radius: 30px;transition: 0.2s;border: 1px solid transparent;}
    .header .back-link:hover {background: #f0faf4;border-color: #2ecc71;color: #2ecc71;}

    .info-bar {background: #eef9f2;border-radius: 10px;padding: 0.7rem 1.2rem;margin-bottom: 1.5rem;color: #2c3e50;font-size: 0.9rem;display: flex;align-items: center;gap: 10px;flex-shrink: 0;}
    .info-bar i {color: #2ecc71;font-size: 1.2rem;}
    .info-bar .max-warning {color: #e67e22;font-weight: 600;margin-left: auto;}

    .body-scroll {flex: 1;overflow-y: auto;padding-right: 4px;}
    .body-scroll::-webkit-scrollbar {width: 4px;}
    .body-scroll::-webkit-scrollbar-thumb {background: #bdc3c7;border-radius: 10px;}

    .section-label {font-weight: 700;color: #2c3e50;margin: 1.2rem 0 0.6rem;font-size: 0.95rem;}
    .section-label:first-of-type {margin-top: 0;}

    .skills-grid {display: flex;flex-wrap: wrap;gap: 8px;padding: 4px 0;}

    .skill-option {background: #f2f5f3;border: 2px solid transparent;border-radius: 30px;padding: 6px 18px;cursor: pointer;font-size: 0.9rem;transition: all 0.2s;user-select: none;color: #2c3e50;}
    .skill-option:hover {background: #e8f5e9;border-color: #a9dfbf;transform: translateY(-1px);}
    .skill-option.selected {background: #2ecc71;color: #fff;border-color: #27ae60;box-shadow: 0 4px 12px rgba(46,204,113,0.25);}
    .skill-option.selected:hover {background: #27ae60;}
    .skill-option.disabled {opacity: 0.5;cursor: not-allowed;}
    .skill-option.disabled:hover {transform: none;border-color: transparent;}

    .custom-section {margin: 1.2rem 0 0.8rem;padding: 1rem 1.2rem;background: #fafcfa;border-radius: 12px;border: 1px solid #e8eeec;}
    .custom-input-group {display: flex;gap: 10px;margin-top: 6px;}
    .custom-input-group input {flex: 1;padding: 8px 14px;border: 1px solid #ddd;border-radius: 8px;font-size: 0.95rem;transition: 0.2s;}
    .custom-input-group input:focus {border-color: #2ecc71;outline: none;box-shadow: 0 0 0 3px rgba(46,204,113,0.1);}
    .custom-input-group button {background: #2ecc71;color: #fff;border: none;border-radius: 8px;padding: 0 24px;font-weight: 600;cursor: pointer;transition: 0.2s;white-space: nowrap;}
    .custom-input-group button:hover {background: #27ae60;}
    .custom-input-group button:active {transform: scale(0.96);}
    .error-msg {color: #e74c3c;font-size: 0.8rem;margin-top: 4px;min-height: 20px;}

    .selected-section {margin: 0.8rem 0 0.2rem;}
    .selected-tags {display: flex;flex-wrap: wrap;gap: 8px;min-height: 40px;padding: 6px 0;}
    .selected-tag {background: #2ecc71;color: #fff;border-radius: 30px;padding: 4px 14px 4px 18px;font-size: 0.9rem;display: inline-flex;align-items: center;gap: 8px;animation: fadeIn 0.2s ease;}
    .selected-tag .remove-btn {cursor: pointer;font-weight: 700;font-size: 1.1rem;line-height: 1;color: rgba(255,255,255,0.7);transition: 0.2s;}
    .selected-tag .remove-btn:hover {color: #fff;transform: scale(1.2);}
    .empty-hint {color: #95a5a6;font-size: 0.9rem;font-style: italic;}
    @keyframes fadeIn {from {opacity: 0;transform: scale(0.9);} to {opacity: 1;transform: scale(1);}}

    .footer-actions {display: flex;justify-content: flex-end;gap: 12px;margin-top: 1.5rem;padding-top: 1.2rem;border-top: 1px solid #e8eeec;flex-shrink: 0;}
    .footer-actions button {padding: 10px 32px;border-radius: 30px;border: none;font-weight: 700;font-size: 0.95rem;cursor: pointer;transition: 0.2s;}
    .btn-save {background: #2ecc71;color: #fff;box-shadow: 0 4px 14px rgba(46,204,113,0.25);}
    .btn-save:hover {background: #27ae60;transform: translateY(-2px);box-shadow: 0 6px 20px rgba(46,204,113,0.35);}
    .btn-cancel {background: #f2f5f3;color: #2c3e50;}
    .btn-cancel:hover {background: #e8eeec;}

    @media (max-width: 640px) {
        .container {padding: 1.2rem;}
        .header {flex-wrap: wrap;gap: 10px;}
        .header .title h1 {font-size: 1.3rem;}
        .custom-input-group {flex-wrap: wrap;}
        .custom-input-group button {width: 100%;padding: 10px;}
        .footer-actions {flex-wrap: wrap;}
        .footer-actions button {flex: 1;text-align: center;}
    }
    </style>
</head>

<body>

    <!-- ===== Background Animation ===== -->
    <div class="bg-animation-wrapper">
        <div class="bg-shape circle-1"></div>
        <div class="bg-shape square-1"></div>
        <div class="bg-shape triangle-1"></div>
        <div class="bg-shape circle-2"></div>
    </div>

    <!-- ===== Main Container ===== -->
    <div class="container">

        <!-- ===== header ===== -->
        <div class="header">
            <div class="title">
                <h1>🏷️ skills</h1>
                <span class="count-badge" id="headerCount">0 / 5</span>
            </div>
            <a>← Back</a>
        </div>

        <!-- ===== info bar ===== -->
        <div class="info-bar">
            <i>💡</i>
            <span>Click on preset skills or add custom ones, up to <strong>5</strong> selections</span>
            <span class="max-warning" id="maxWarning"></span>
        </div>

        <!-- ===== body scroll ===== -->
        <div class="body-scroll">

            <!-- Preset Skills -->
            <div class="section-label">📌 Preset Skills</div>
            <div id="presetSkillsContainer" class="skills-grid"></div>

            <!-- Custom Add -->
            <div class="custom-section">
                <div class="section-label" style="margin-top:0;">✏️ Custom Skills</div>
                <div class="custom-input-group">
                    <input type="text" id="customSkillInput" placeholder="Enter skill name, e.g., Figma" maxlength="30">
                    <button>Add</button>
                </div>
                <div id="customError" class="error-msg"></div>
            </div>

            <!-- Selected Skills -->
            <div class="selected-section">
                <div class="section-label">✅ Selected Skills</div>
                <div id="selectedSkillsContainer" class="selected-tags">
                    <span class="empty-hint">No skills selected yet</span>
                </div>
            </div>

        </div>

        <!-- ===== Footer Actions ===== -->
        <div class="footer-actions">
            <button >Cancel</button>
            <button >Save Skills</button>
        </div>

    </div>

</body>
</html>
