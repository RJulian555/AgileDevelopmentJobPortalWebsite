<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body { font-family: sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { margin-top: 0; color: #111827; }
        input { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem 0; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #059669; }
        .msg { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; display: none; font-size: 0.875rem; }
        .error { background: #fde8e8; color: #9b1c1c; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create New Password</h2>
        <form id="resetForm">
            <label>New Password</label>
            <input type="password" id="newPassword" required placeholder="At least 6 characters">
            
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" required placeholder="Type password again">
            
            <button type="submit">Update Password</button>
        </form>
        <div id="msgBox" class="msg error"></div>
    </div>

    <script>
        // Extract the ?token=XYZ value from the browser address bar
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msgBox = document.getElementById('msgBox');

            // Client-side Validation: Match both entries to prevent user error
            if (newPassword !== confirmPassword) {
                msgBox.style.display = 'block';
                msgBox.innerText = "Error: Passwords do not match. Please verify.";
                return;
            }

            if (!token) {
                msgBox.style.display = 'block';
                msgBox.innerText = "Error: Security reset token is missing from URL.";
                return;
            }

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    alert("Success! Password updated in database. Redirecting to login page...");
                    window.location.href = '/login.html'; // Send them straight back to login page
                } else {
                    msgBox.style.display = 'block';
                    msgBox.innerText = data.error || "An error occurred.";
                }
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.innerText = "Failed to connect to server.";
            }
        });
    </script>
</body>
</html>
